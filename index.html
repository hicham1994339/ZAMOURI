<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيادة طبية عامة للدكتورة زموري</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:"Tahoma","Arial",sans-serif;
}

:root{
    --primary:#0f766e;
    --primary-dark:#115e59;
    --secondary:#14b8a6;
    --light:#f0fdfa;
    --bg:#f4f7f9;
    --white:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --danger:#dc2626;
    --warning:#d97706;
    --success:#16a34a;
    --border:#e5e7eb;
    --shadow:0 8px 25px rgba(0,0,0,.07);
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,input,select,textarea{
    font-family:inherit;
}

button{
    cursor:pointer;
    border:none;
}

.app{
    display:flex;
    min-height:100vh;
}

/* SIDEBAR */
.sidebar{
    width:260px;
    background:linear-gradient(180deg,#0f766e,#115e59);
    color:white;
    padding:22px 15px;
    position:fixed;
    right:0;
    top:0;
    bottom:0;
    z-index:1000;
    overflow-y:auto;
}

.logo{
    text-align:center;
    padding:10px 5px 25px;
    border-bottom:1px solid rgba(255,255,255,.15);
    margin-bottom:15px;
}

.logo-icon{
    width:70px;
    height:70px;
    border-radius:50%;
    background:white;
    color:var(--primary);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    margin:0 auto 10px;
}

.logo h2{
    font-size:18px;
    line-height:1.6;
}

.logo p{
    font-size:12px;
    opacity:.8;
}

.nav-btn{
    width:100%;
    padding:13px 15px;
    margin:4px 0;
    border-radius:10px;
    background:transparent;
    color:white;
    text-align:right;
    transition:.2s;
    font-size:14px;
}

.nav-btn:hover,
.nav-btn.active{
    background:rgba(255,255,255,.16);
}

.nav-btn span{
    margin-left:9px;
}

.sidebar-bottom{
    margin-top:25px;
    padding-top:15px;
    border-top:1px solid rgba(255,255,255,.15);
}

.sidebar-bottom button{
    width:100%;
    padding:10px;
    border-radius:8px;
    margin-top:7px;
}

/* MAIN */
.main{
    margin-right:260px;
    width:calc(100% - 260px);
    min-height:100vh;
}

.topbar{
    background:white;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    box-shadow:0 2px 10px rgba(0,0,0,.04);
    position:sticky;
    top:0;
    z-index:900;
}

.menu-mobile{
    display:none;
    font-size:25px;
    background:none;
}

.top-title{
    font-size:18px;
    font-weight:bold;
}

.date-now{
    color:var(--muted);
    font-size:13px;
}

.content{
    padding:25px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* CARDS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}

.stat-card{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    gap:15px;
}

.stat-icon{
    width:55px;
    height:55px;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    background:var(--light);
}

.stat-card h3{
    font-size:25px;
    margin-bottom:4px;
}

.stat-card p{
    color:var(--muted);
    font-size:13px;
}

.card{
    background:white;
    border-radius:15px;
    box-shadow:var(--shadow);
    padding:22px;
    margin-bottom:20px;
}

.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
}

.card-header h2{
    font-size:18px;
}

.card-header p{
    color:var(--muted);
    font-size:13px;
}

/* BUTTONS */
.btn{
    padding:10px 16px;
    border-radius:8px;
    font-size:13px;
    transition:.2s;
}

.btn-primary{
    background:var(--primary);
    color:white;
}

.btn-primary:hover{
    background:var(--primary-dark);
}

.btn-secondary{
    background:#e6fffb;
    color:#0f766e;
}

.btn-danger{
    background:#fee2e2;
    color:#b91c1c;
}

.btn-warning{
    background:#fef3c7;
    color:#92400e;
}

.btn-success{
    background:#dcfce7;
    color:#166534;
}

.btn-light{
    background:#f3f4f6;
    color:#374151;
}

.btn-sm{
    padding:7px 10px;
    font-size:12px;
}

/* TABLE */
.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:13px 10px;
    border-bottom:1px solid var(--border);
    text-align:right;
    font-size:13px;
}

th{
    background:#f8fafc;
    color:#374151;
    font-weight:bold;
}

tr:hover td{
    background:#fafafa;
}

.actions{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
}

/* FORMS */
.form
